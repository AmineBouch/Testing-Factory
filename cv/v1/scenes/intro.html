<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Intro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#141B2E;font-family:'Segoe UI',Arial,sans-serif;color:#F3F5F8}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-220px;top:-200px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,84,31,.28),rgba(201,84,31,0) 65%);animation:breathe 4s ease-in-out both}
.box{position:absolute;left:112px;top:170px;width:1000px}
.bar{height:8px;width:0;background:#E0713A;border-radius:4px;animation:bar .6s .15s cubic-bezier(.2,.8,.2,1) forwards}
.kicker{margin-top:26px;font-size:20px;letter-spacing:.32em;color:#E0713A;font-weight:600;opacity:0;animation:up .6s .35s ease-out forwards}
h1{margin-top:10px;font-size:92px;font-weight:700;letter-spacing:-.01em;line-height:1;opacity:0;animation:up .7s .5s cubic-bezier(.2,.8,.2,1) forwards}
.title{margin-top:18px;font-size:38px;font-weight:600;color:#FFFFFF;opacity:0;animation:up .6s 1.0s ease-out forwards}
.tags{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.tags span{font-size:21px;padding:8px 18px;border:1.5px solid rgba(255,255,255,.22);border-radius:999px;color:#C9CFDD;opacity:0;animation:up .5s ease-out forwards}
.tags span:nth-child(1){animation-delay:1.5s}.tags span:nth-child(2){animation-delay:1.7s}
.tags span:nth-child(3){animation-delay:1.9s}.tags span:nth-child(4){animation-delay:2.1s}
.motto{margin-top:34px;display:flex;align-items:center;gap:14px;font-size:27px;color:#C9CFDD;opacity:0;animation:up .6s 2.5s ease-out forwards}
.motto b{color:#FFFFFF;font-weight:700}
.motto i{font-style:normal;color:#E0713A;font-weight:700}
@keyframes bar{to{width:96px}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes breathe{from{transform:scale(.85);opacity:.4}to{transform:scale(1.05);opacity:1}}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="box">
  <div class="bar"></div>
  <div class="kicker">HI, I'M</div>
  <h1>Amine Bouchghoul</h1>
  <div class="title">QA / Lead QA Engineer</div>
  <div class="tags"><span>10+ years in testing</span><span>End-to-end &amp; UAT</span><span>Test automation</span><span>Agile · E-commerce</span></div>
  <div class="motto"><b>User story &amp; bug in</b><i>→</i><span>tested, automated and reported out</span></div>
</div>
</body></html>
