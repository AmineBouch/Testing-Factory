<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Traceability</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#141B2E;font-family:'Segoe UI',Arial,sans-serif;color:#F3F5F8}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.head{position:absolute;left:80px;top:46px;opacity:0;animation:up .5s ease-out forwards}
.head small{display:block;font-size:17px;letter-spacing:.3em;color:#E0713A;font-weight:600}
.head b{display:block;font-size:40px;font-weight:700;margin-top:4px}
.card{position:absolute;top:286px;width:166px;height:150px;border-radius:16px;background:#1D2640;border:1.5px solid #34406A;padding:16px 14px;
  opacity:0;animation:pop .45s cubic-bezier(.2,1.3,.4,1) forwards;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.card .bar{height:6px;width:40px;border-radius:3px;margin-bottom:12px}
.card small{display:block;font-size:13px;letter-spacing:.16em;color:#9BA3B8;font-weight:600}
.card b{display:block;font-size:22px;margin-top:4px;line-height:1.15}
.card code{display:block;margin-top:10px;font-family:Consolas,monospace;font-size:16px;color:#E0713A}
.c1{left:70px;animation-delay:.3s}.c2{left:270px;animation-delay:.7s}.c3{left:470px;animation-delay:1.1s}
.c4{left:670px;animation-delay:1.5s}.c5{left:870px;animation-delay:1.9s}.c6{left:1070px;animation-delay:2.3s}
.link{position:absolute;top:346px;width:34px;text-align:center;font-size:26px;color:#E0713A;font-weight:700;opacity:0;animation:fade .3s forwards}
.k1{left:236px;animation-delay:.9s}.k2{left:436px;animation-delay:1.3s}.k3{left:636px;animation-delay:1.7s}
.k4{left:836px;animation-delay:2.1s}.k5{left:1036px;animation-delay:2.5s}
.sweep{position:absolute;top:278px;left:62px;width:182px;height:166px;border-radius:20px;border:3px solid #FFD2B8;opacity:0;
  animation:sweep 1.6s 2.9s ease-in-out forwards}
.cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:26px;color:#C9CFDD;opacity:0;animation:up .6s 2.8s ease-out forwards}
.cap em{font-style:normal;color:#fff;font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes sweep{0%{opacity:0;left:62px}10%{opacity:1}90%{opacity:1;left:1062px}100%{opacity:0;left:1062px}}
</style></head><body>
<div class="grid"></div>
<div class="head"><small>FULL TRACEABILITY</small><b>Every result traces back to the requirement</b></div>
<div class="card c1"><div class="bar" style="background:#2684FF"></div><small>JIRA</small><b>User story</b><code>SCRUM-101</code></div>
<div class="card c2"><div class="bar" style="background:#27AE60"></div><small>XRAY</small><b>Test case</b><code>SCRUM-102</code></div>
<div class="card c3"><div class="bar" style="background:#9FD39B"></div><small>BDD</small><b>Gherkin</b><code>SCRUM-110</code></div>
<div class="card c4"><div class="bar" style="background:#27AE60"></div><small>XRAY</small><b>Test plan</b><code>SCRUM-118</code></div>
<div class="card c5"><div class="bar" style="background:#45BA4B"></div><small>PLAYWRIGHT</small><b>Execution</b><code>7 / 8 passed</code></div>
<div class="card c6"><div class="bar" style="background:#4A154B"></div><small>REPORT</small><b>Run summary</b><code>on Slack</code></div>
<div class="link k1">⇄</div><div class="link k2">⇄</div><div class="link k3">⇄</div><div class="link k4">⇄</div><div class="link k5">⇄</div>
<div class="sweep"></div>
<div class="cap">Linked in Jira &amp; Xray: <em>story ⇄ tests ⇄ plan ⇄ results</em></div>
</body></html>
