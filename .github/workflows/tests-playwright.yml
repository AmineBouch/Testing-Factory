# Exécute les tests Playwright sur les serveurs GitHub (PC éteint ou non),
# puis génère le rapport d'exécution (PDF + vidéo 10 s) et l'envoie par mail, Slack et Teams.
name: Tests Playwright + rapport

on:
  schedule:
    # Tous les jours à 07:00 heure de Paris en hiver (08:00 en été). GitHub planifie en UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      plan:
        description: "Test Plan Xray à afficher dans le rapport (ex. SCRUM-118), facultatif"
        required: false
        default: ""

concurrency:
  group: tests-playwright
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  # Les scripts lisent ces variables directement (elles priment sur un éventuel .env).
  MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
  MAIL_SMTP_APP_PASSWORD: ${{ secrets.MAIL_SMTP_APP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
  # ffmpeg d'Ubuntu (avec le filtre drawtext) pour la vidéo résumé de 10 s.
  IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          cd automation
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg

      # Affiche seulement « défini » ou « vide » pour chaque secret, jamais sa valeur.
      - name: Vérifier les Secrets
        run: |
          for k in MAIL_SMTP_USER MAIL_SMTP_APP_PASSWORD MAIL_TO SLACK_WEBHOOK_URL \
                   SLACK_BOT_TOKEN SLACK_CHANNEL_ID TEAMS_WEBHOOK_URL; do
            if [ -n "${!k}" ]; then echo "$k : défini"; else echo "$k : vide"; fi
          done

      - name: Lancer les tests
        id: tests
        continue-on-error: true
        working-directory: automation
        run: npm test

      - name: Générer et envoyer le rapport d'exécution
        if: always()
        run: |
          PLAN="${{ github.event.inputs.plan }}"
          if [ -n "$PLAN" ]; then
            python .claude/skills/test-plan/exec_report.py --plan "$PLAN"
          else
            python .claude/skills/test-plan/exec_report.py
          fi

      - name: Conserver les rapports (30 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-${{ github.run_number }}
          retention-days: 30
          path: |
            reports/execution-playwright-*
            automation/playwright-report/

      - name: Marquer le run en échec si des tests ont échoué
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Au moins un test Playwright a échoué (voir le rapport envoyé)."
          exit 1
